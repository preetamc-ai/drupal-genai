    - pii_phone_number
    - pii_credit_card_number
    - pii_email_address
post_generate_guardrails:
  plugin_id:
    - pii_iban
    - pii_phone_number
    - pii_credit_card_number
    - pii_email_address
stop_threshold: 0.8
