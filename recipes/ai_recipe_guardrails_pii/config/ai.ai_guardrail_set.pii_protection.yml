id: pii_protection
label: 'PII Protection'
description: 'Blocks personally identifiable information (PII) in both user input and AI output. Checks for email addresses, phone numbers, credit card numbers, and IBAN bank account numbers. Apply this guardrail set to any public-facing AI interactions to meet baseline GDPR and data protection requirements.'
